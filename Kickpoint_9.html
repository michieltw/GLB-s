<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hockey Stick Flex & Zone Simulatie</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: grab;
        }

        #canvas-container:active {
            cursor: grabbing;
        }

        canvas {
            background-color: #1a1a1a;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            border-bottom: 1px solid #333;
            max-width: 100%;
            max-height: 100%;
        }

        #controls {
            width: 100%;
            background-color: #222;
            padding: 15px 20px 25px 20px;
            box-sizing: border-box;
            border-top: 2px solid #444;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 45vh;
            overflow-y: auto;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        label { font-weight: bold; font-size: 14px; color: #ddd; }
        .val-display { color: #00d2ff; font-weight: bold; font-family: monospace; font-size: 16px;}

        .speed-category { font-size: 12px; color: #aaa; font-style: italic; }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 12px;
            border-radius: 6px;
            background: #444;
            outline: none;
            margin: 10px 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #00d2ff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        .toggles {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            font-size: 14px;
            align-items: center;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            background: #333;
            padding: 8px 12px;
            border-radius: 6px;
        }

        input[type="checkbox"] { width: 18px; height: 18px; }

        button.info-btn, button.zoom-btn {
            background-color: #00d2ff; color: #000; border: none;
            border-radius: 4px; padding: 4px 10px; font-weight: bold;
            cursor: pointer; font-size: 13px;
        }
        button.unit-btn {
            background-color: #444; color: #fff; border: 1px solid #666;
            border-radius: 4px; padding: 2px 6px; cursor: pointer;
            font-size: 11px; margin-left: 10px;
        }
        button.zoom-btn {
            background-color: #444; color: #fff; border: 1px solid #666;
            padding: 6px 12px; margin-left: 5px; font-size: 14px;
        }

        #advancedSettings {
            display: none;
            background: #181818;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 12px;
            gap: 10px;
        }

        #advancedSettings.open {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }

        .advanced-control {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .advanced-control label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #ccc;
        }

        .advanced-control input[type="range"] {
            height: 8px;
            margin: 5px 0;
        }

        .advanced-control input[type="range"]::-webkit-slider-thumb {
            width: 18px;
            height: 18px;
        }

        #dragTooltip {
            position: absolute; background: rgba(0,0,0,0.8); color: #fff;
            padding: 5px 10px; border-radius: 4px; font-size: 12px;
            pointer-events: none; display: none; white-space: nowrap;
            z-index: 100; border: 1px solid #00d2ff; text-align: center;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="simCanvas" width="700" height="460"></canvas>
        <div id="dragTooltip">Tooltip</div>
    </div>

    <div id="controls">
        <div class="control-group">
            <div class="header-row">
                <label>Swing Rotation:</label>
                <span class="val-display" id="valRot">130°</span>
            </div>
            <input type="range" id="timeSlider" min="0" max="1000" value="0">
        </div>

        <div class="control-group">
            <div class="header-row">
                <label style="display:flex; align-items:center; gap: 10px;">
                    Shot Speed:
                    <button class="info-btn" onclick="alert('Record Info:\n\nKHL: 183,7 km/h (Bauer Supreme, 112 Flex)\nNHL: 175,1 km/h (Warrior Dynasty, 150 Flex)')">ℹ Info</button>
                    <button class="unit-btn" id="unitToggle">KM/H</button>
                </label>
                <span class="val-display" id="valSpeed">100 km/h</span>
            </div>
            <span class="speed-category" id="speedCat">Gevorderd</span>
            <input type="range" id="speedSlider" min="20" max="200" value="100">
        </div>

        <div class="toggles">
            <label class="checkbox-label">
                <input type="checkbox" id="cbKp2"> + Kick Zone 2
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="cbKp3"> + Kick Zone 3
            </label>
            <label class="checkbox-label" style="margin-left: 10px; border-left: 2px solid #555; padding-left: 15px;">
                <input type="checkbox" id="cbShowHelpers" checked> 👁️ Toon Hulplijnen
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="cbNeverBreak"> Nooit breken
            </label>
            <div style="flex-grow: 1;"></div>
            <button class="zoom-btn" onclick="doZoom(0.8)">🔍 -</button>
            <button class="zoom-btn" onclick="doZoom(1.25)">🔍 +</button>
        </div>
        <button class="zoom-btn" id="advancedToggle" type="button">⚙ Advanced settings</button>

        <div id="advancedSettings">
            <div class="advanced-control">
                <label>Base bend <span id="advBendValue"></span></label>
                <input type="range" id="advBend" min="1" max="80" step="1" value="60">
            </div>
            <div class="advanced-control">
                <label>Flex resistance <span id="advResistanceValue"></span></label>
                <input type="range" id="advResistance" min="0" max="1" step="0.01" value="0.60">
            </div>
            <div class="advanced-control">
                <label>Speed curve <span id="advSpeedCurveValue"></span></label>
                <input type="range" id="advSpeedCurve" min="0.5" max="2" step="0.05" value="1">
            </div>
            <div class="advanced-control">
                <label>Flex 20 break angle <span id="advBreakLowValue"></span></label>
                <input type="range" id="advBreakLow" min="20" max="300" step="1" value="200">
            </div>
            <div class="advanced-control">
                <label>Flex 125 break angle <span id="advBreakHighValue"></span></label>
                <input type="range" id="advBreakHigh" min="15" max="300" step="1" value="130">
            </div>
            <div class="advanced-control">
                <label>Local angle scale <span id="advAngleScaleValue"></span></label>
                <input type="range" id="advAngleScale" min="0.1" max="10" step="0.1" value="1">
            </div>
            <div class="advanced-control">
                <label>Whip strength <span id="advWhipValue"></span></label>
                <input type="range" id="advWhip" min="0" max="1" step="0.01" value="0.15">
            </div>
            <div class="advanced-control">
                <label>Bend start <span id="advStartValue"></span></label>
                <input type="range" id="advStart" min="0.3" max="0.8" step="0.01" value="0.5625">
            </div>
            <div class="advanced-control">
                <label>Bend peak/end <span id="advPeakValue"></span></label>
                <input type="range" id="advPeak" min="0.65" max="0.98" step="0.01" value="0.85">
            </div>
            <div class="advanced-control">
                <label>Force strength <span id="advForceStrengthValue"></span></label>
                <input type="range" id="advForceStrength" min="0.1" max="10" step="0.1" value="1">
            </div>
            <div class="advanced-control">
                <label>Force curve <span id="advForceCurveValue"></span></label>
                <input type="range" id="advForceCurve" min="0.5" max="3" step="0.05" value="1">
            </div>
            <div class="advanced-control">
                <label>Clamp position <span id="advClampPositionValue"></span></label>
                <input type="range" id="advClampPosition" min="0.02" max="0.4" step="0.01" value="0.12">
            </div>
            <div class="advanced-control">
                <label>Floor friction <span id="advFloorFrictionValue"></span></label>
                <input type="range" id="advFloorFriction" min="0" max="1" step="0.01" value="0.35">
            </div>
            <div class="advanced-control">
                <label>Puck impact strength <span id="advImpactStrengthValue"></span></label>
                <input type="range" id="advImpactStrength" min="0" max="2" step="0.01" value="1">
            </div>
            <div class="advanced-control">
                <label>Elastic recoil <span id="advRecoilStrengthValue"></span></label>
                <input type="range" id="advRecoilStrength" min="0" max="2" step="0.01" value="0.7">
            </div>
        </div>

        <div style="font-size: 11px; color: #888; text-align: center; margin-top: 5px;">
            Sleep op een leeg stuk canvas om te verplaatsen (Pan). <br>Sleep de bolletjes/vierkantjes voor configuratie, en horizontaal voor Flex.
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const tooltip = document.getElementById('dragTooltip');

        function resize() {
            // Set canvas size dynamically
            const container = document.getElementById('canvas-container');
            if (container) {
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
            } else {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight * 0.55; // Guess fallback
            }
            CENTER_X = canvas.width / 2;
            CENTER_Y = 150; // Set pivot point to 15% from top

            // Recompute physics based on new centers just in case
            precalculatePhysics();
            draw();
        }
        window.addEventListener('resize', resize);


        const timeSlider = document.getElementById('timeSlider');
        const speedSlider = document.getElementById('speedSlider');
        const unitToggle = document.getElementById('unitToggle');
        const cbKp2 = document.getElementById('cbKp2');
        const cbKp3 = document.getElementById('cbKp3');
        const cbShowHelpers = document.getElementById('cbShowHelpers');
        const cbNeverBreak = document.getElementById('cbNeverBreak');
        const valRot = document.getElementById('valRot');
        const valSpeed = document.getElementById('valSpeed');
        const speedCat = document.getElementById('speedCat');

        const advancedToggle = document.getElementById('advancedToggle');
        const advancedSettings = document.getElementById('advancedSettings');
        const advancedControls = {
            bend: document.getElementById('advBend'),
            resistance: document.getElementById('advResistance'),
            speedCurve: document.getElementById('advSpeedCurve'),
            breakLow: document.getElementById('advBreakLow'),
            breakHigh: document.getElementById('advBreakHigh'),
            angleScale: document.getElementById('advAngleScale'),
            whip: document.getElementById('advWhip'),
            start: document.getElementById('advStart'),
            peak: document.getElementById('advPeak'),
            forceStrength: document.getElementById('advForceStrength'),
            forceCurve: document.getElementById('advForceCurve'),
            clampPosition: document.getElementById('advClampPosition'),
            floorFriction: document.getElementById('advFloorFriction'),
            impactStrength: document.getElementById('advImpactStrength'),
            recoilStrength: document.getElementById('advRecoilStrength')
        };
        const advancedValues = {
            bend: document.getElementById('advBendValue'),
            resistance: document.getElementById('advResistanceValue'),
            speedCurve: document.getElementById('advSpeedCurveValue'),
            breakLow: document.getElementById('advBreakLowValue'),
            breakHigh: document.getElementById('advBreakHighValue'),
            angleScale: document.getElementById('advAngleScaleValue'),
            whip: document.getElementById('advWhipValue'),
            start: document.getElementById('advStartValue'),
            peak: document.getElementById('advPeakValue'),
            forceStrength: document.getElementById('advForceStrengthValue'),
            forceCurve: document.getElementById('advForceCurveValue'),
            clampPosition: document.getElementById('advClampPositionValue'),
            floorFriction: document.getElementById('advFloorFrictionValue'),
            impactStrength: document.getElementById('advImpactStrengthValue'),
            recoilStrength: document.getElementById('advRecoilStrengthValue')
        };

        function getAdvancedNumber(name) {
            return parseFloat(advancedControls[name].value);
        }

        function updateAdvancedValueLabels() {
            Object.keys(advancedControls).forEach(name => {
                const value = getAdvancedNumber(name);
                advancedValues[name].textContent = name.includes('break') ? `${value}°` : value;
            });
        }

        // Basis instellingen (worden live geschaald door de Pan/Zoom logic)
        const ROD_LENGTH = 380;
        let CENTER_X = window.innerWidth / 2;
        let CENTER_Y = 40;
        const SEGMENTS = 50;

        // Maximum local bend before snapping. Softer sticks bend farther before breaking.
        function getBreakLimit(currentFlex) {
            const clampedFlex = Math.max(20, Math.min(125, currentFlex));
            const lowLimit = getAdvancedNumber('breakLow');
            const highLimit = getAdvancedNumber('breakHigh');
            return lowLimit - ((clampedFlex - 20) * (lowLimit - highLimit) / 105);
        }

        // State & Pan/Zoom transformaties
        let kp1 = 0.5;
        let kp2 = { c: 0.7, w: 0.1 };
        let kp3 = { c: 0.85, w: 0.1 };
        let flex = 75;
        let useMph = false;

        // Panning en Zooming Variabelen
        let zoom = 1.0;
        let panX = 0;
        let panY = 0;
        let dragging = null;
        let lastPanPos = {x: 0, y: 0};

        let precalculatedTips = [];
        let precalculatedPhysicsData = []; // Store full physics state at each step
        let brokenState = null;
        let lastSwingT = null;
        let breakTriggerT = null;
        let forcedBreakIndex = -1;
        const FALL_DISTANCE_PER_SWING = 35;
        const deg2rad = deg => deg * Math.PI / 180;

        function doZoom(factor) {
            let centerX = canvas.width / 2;
            let centerY = canvas.height / 2;
            panX = centerX - (centerX - panX) * factor;
            panY = centerY - (centerY - panY) * factor;
            zoom *= factor;

            // Limit zoom
            zoom = Math.max(0.4, Math.min(zoom, 4.0));
            draw();
        }

        function getSpeedCategory(speed) {
            if(speed < 65) return "Beginner";
            if(speed < 95) return "Gemiddeld";
            if(speed < 130) return "Gevorderd";
            if(speed < 160) return "Pro";
            if(speed < 185) return "Elite";
            return "Hardste schot ooit";
        }

        function getKpName(index, val) {
            if(index === 1) return "Handschoenpositie";
            let v = val * 100;
            let suffix = index > 1 ? " Zone" : "";
            if(v >= 80) return "Ultra-Low Kickpoint" + suffix;
            if(v >= 65) return "Low Kickpoint" + suffix;
            if(v >= 55) return "Mid-Low Kickpoint" + suffix;
            if(v >= 40) return "Mid Kickpoint" + suffix;
            if(v >= 30) return "Amplified Mid Kickpoint" + suffix;
            return "High Kickpoint" + suffix;
        }

        // The rotation is driven by an opposing horizontal force couple:
        // the clamped upper section is pulled left, while the glove position
        // is pulled right. The slider controls time through that force stroke.
        function getForceData(t) {
            const forceCurve = getAdvancedNumber('forceCurve');
            const activation = Math.max(0, Math.min(1, t));
            const forceProgress = Math.pow(activation, forceCurve);
            const force = getAdvancedNumber('forceStrength') * (0.2 + 0.8 * forceProgress);
            const clampPosition = getAdvancedNumber('clampPosition');
            const leverArm = Math.max(0.02, kp1 - clampPosition) * ROD_LENGTH;
            const nominalAngle = deg2rad(110 - 70 * t);
            const torque = force * leverArm * Math.abs(Math.sin(nominalAngle));
            return { force, clampPosition, torque };
        }

        function getForceRotation(t) {
            const sampleCount = 60;
            let accumulatedTorque = 0;
            let totalTorque = 0;

            for (let i = 0; i <= sampleCount; i++) {
                const sampleT = i / sampleCount;
                const torque = getForceData(sampleT).torque;
                totalTorque += torque;
                if (sampleT <= t) accumulatedTorque += torque;
            }

            const progress = totalTorque > 0 ? accumulatedTorque / totalTorque : t;
            return 130 + (70 * Math.min(1, progress));
        }

        function getT() {
            // Keep t as normalized swing progress (0..1). Do not convert the
            // force-driven rotation back into t; that caused premature bending.
            return parseInt(timeSlider.value) / 1000;
        }

        function getSwingAngle(t) {
            // This is the same 0..240° angle shown by the Swing Rotation
            // control. Contact must be based on this angle, not on the
            // separate force-couple calibration angle.
            return Math.max(0, Math.min(240, t * 240));
        }

        function getRawBend(t, speed, currentFlex) {
            // Floor drag starts at 140° of swing rotation. The puck is hit at
            // 150°. Before 140° the bend is exactly zero.
            const rotation = getSwingAngle(t);
            const floorProgress = Math.max(0, Math.min(1, (rotation - 140) / 10));
            const impactProgress = Math.max(0, Math.min(1, (rotation - 150) / 50));
            const clampedFlex = Math.max(20, Math.min(125, currentFlex));
            const flexProgress = (clampedFlex - 20) / 105;
            const resistance = Math.max(0.05, 1 - flexProgress * getAdvancedNumber('resistance'));
            const speedFactor = Math.pow(Math.max(0, speed) / 200, getAdvancedNumber('speedCurve'));

            // Floor contact creates a small, gradual bend before the puck is hit.
            // The friction slider is normalized (0..1), so convert it to a
            // meaningful angular contribution instead of adding less than one
            // degree to the entire rod.
            const floorBend = floorProgress * getAdvancedNumber('floorFriction') *
                (6 + speedFactor * 6);
            const impactBend = Math.sin(impactProgress * Math.PI / 2) *
                speedFactor * getAdvancedNumber('bend') * resistance *
                getAdvancedNumber('impactStrength');
            const storedBend = floorBend + impactBend;
            const recoilProgress = Math.max(0, Math.min(1, (rotation - 175) / 45));
            const recoil = Math.sin(recoilProgress * Math.PI / 2) *
                storedBend * getAdvancedNumber('recoilStrength');

            return rotation < 140 ? 0 : storedBend - recoil;
        }

        function precalculatePhysics() {
            precalculatedTips = [];
            precalculatedPhysicsData = [];

            const speed = parseFloat(speedSlider.value);
            const clampedFlex = Math.max(20, Math.min(125, flex));
            const flexProgress = (clampedFlex - 20) / 105;
            // A real hockey stick has a natural frequency of ~25Hz.
            // Observation: During a heavy wrist/snap shot weight transfer (like Kessel),
            // players compress downwards into the stick. The resulting flex is heavily dependent on the flex rating.
            // We'll broaden the range between low-flex and high-flex stiffness to make the difference more visually striking.
            // A lower flex means it should be significantly less stiff (more bendy).
            // A higher flex means it should be significantly stiffer (less bendy).
            const stiffnessBase = 2000 + flexProgress * 40000 * getAdvancedNumber('resistance');
            const floorFrictionCoef = getAdvancedNumber('floorFriction') * 0.7; // increased pre-load friction
            const impactCoef = getAdvancedNumber('impactStrength') * 3.0; // heavier puck impact load
            const recoilCoef = getAdvancedNumber('recoilStrength');
            const speedFactor = Math.pow(Math.max(0, speed) / 200, getAdvancedNumber('speedCurve'));

            // Stick rotational inertia
            const I_shaft = 100.0;
            const dt = 1.0 / 1000.0;

            // State
            let angularPos = 240; // Starts at 240 deg
            let angularVel = 0;

            // Stick bends (angles in degrees relative to the unbent stick)
            let stickBendB = 0;
            let bendVelB = 0;
            let stickBendC = 0;
            let bendVelC = 0;

            // Puck state
            let puckX = CENTER_X + ROD_LENGTH * Math.cos(deg2rad(130)); // Placed at 130 deg impact mark
            let puckY = CENTER_Y + ROD_LENGTH * 0.86;
            let puckVelX = 0;

            // Figure out kickpoints. Axis B is primary (lowest), Axis C is secondary
            let kpList = [];
            if (cbKp2 && cbKp2.checked) kpList.push(kp2.c);
            if (cbKp3 && cbKp3.checked) kpList.push(kp3.c);
            kpList.sort((a,b) => b-a); // highest value (closest to blade) first

            let axisB_pos = kpList.length > 0 ? kpList[0] : kp1; // Defaults to kp1 if no zones checked
            let axisC_pos = kpList.length > 1 ? kpList[1] : kp1;

            // Weight stiffness by how much is clamped above it and what zone it is
            // Lower zones flex more easily
            let stiffnessB = stiffnessBase * (1.0 - axisB_pos * 0.5);
            let stiffnessC = stiffnessBase * (1.0 - axisC_pos * 0.5) * 1.5; // Secondary is stiffer

            // Dynamic Inertia based on kickpoint length (lower kickpoint = less mass to swing = faster whip)
            const lenB = (1.0 - axisB_pos);
            const inertiaB = I_shaft * Math.max(0.05, lenB * lenB);
            const lenC = (1.0 - axisC_pos);
            const inertiaC = I_shaft * Math.max(0.05, lenC * lenC);

            for (let i = 0; i <= 1000; i++) {
                const t = i / 1000.0;

                // Keep pushing old data array for backwards compatibility just in case
                precalculatedTips.push(getRawBend(t, speed, flex));

                // Swing force profile drives the shaft rotation
                // A full swing is roughly 0.25 seconds. If dt = 1/1000, we need to scale up dt effectively or increase torque
                // since t goes from 0 to 1, we map that to the swing duration.
                // Let's make the 1000 steps cover a 0.5s real-world swing. So true_dt = 0.5 / 1000
                const true_dt = 0.5 / 1000.0;

                // Need a massive torque to swing a stick 240 degrees in 0.25 seconds.
                // Let's use proportional control to force angularPos to match the slider `t`
                const targetAngPos = 240 - (t * 240);

                // Swing force profile drives the shaft rotation
                // Rather than pure torque which doesn't reach the puck, let's tie angularPos to T, but
                // calculate velocity for the physics math
                const prevAngPos = angularPos;
                angularPos = targetAngPos;
                angularVel = (angularPos - prevAngPos) / true_dt;

                // Stop at 0 degrees
                if (angularPos < 0) {
                    angularPos = 0;
                    angularVel = 0;
                }

                // 2. External Forces (Ice and Puck) applied at blade
                let externalResistanceTorque = 0;

                if (angularPos <= 140 && angularPos > 130) {
                    // Floor drag starts at 140°
                    const floorProgress = (140 - angularPos) / 10;
                    externalResistanceTorque = floorFrictionCoef * 25000 * floorProgress * speedFactor;
                } else if (angularPos <= 130 && angularPos > 90) {
                    // Puck impact phase
                    const impactProgress = (130 - angularPos) / 40;
                    // Resistance spikes initially and tapers
                    externalResistanceTorque = impactCoef * 100000 * (1.0 - impactProgress) * speedFactor;
                }

                // 3. Update Bends
                // The resistance torque bends the stick at Axis B and Axis C.
                // Spring force tries to unbend it. Damping reduces oscillation.
                const damping = 0.8;

                // Axis B physics
                const springForceB = -stickBendB * stiffnessB;
                const accelBendB = (externalResistanceTorque + springForceB) / inertiaB - (bendVelB * damping);
                bendVelB += accelBendB * true_dt;
                stickBendB += bendVelB * true_dt;

                // Axis C physics (only active if two zones)
                let accelBendC = 0;
                if (kpList.length > 1) {
                    const springForceC = -stickBendC * stiffnessC;
                    accelBendC = ((externalResistanceTorque * 0.6) + springForceC) / inertiaC - (bendVelC * damping);
                    bendVelC += accelBendC * true_dt;
                    stickBendC += bendVelC * true_dt;
                }

                // If stick passes puck (angularPos < 90), apply rapid elastic recoil (whip)
                // A key observation from pro slapshots is that the shaft rapidly unbends and whips forward,
                // accelerating the blade past the shaft's normal angle right as the puck leaves the blade.
                if (angularPos <= 90) {
                    // We apply a stronger restorative spring force multiplier to simulate explosive recoil release
                    const recoilMultiplier = 5.0 * recoilCoef;
                    const springWhipForceB = -stickBendB * stiffnessB * recoilMultiplier;
                    const accelWhipB = springWhipForceB / inertiaB - (bendVelB * damping * 0.5); // reduced damping during whip
                    bendVelB += accelWhipB * true_dt;
                    stickBendB += bendVelB * true_dt;

                    if (kpList.length > 1) {
                        const springWhipForceC = -stickBendC * stiffnessC * recoilMultiplier;
                        const accelWhipC = springWhipForceC / inertiaC - (bendVelC * damping * 0.5);
                        bendVelC += accelWhipC * true_dt;
                        stickBendC += bendVelC * true_dt;
                    }
                }

                // Clamp bends (sticks can't bend backwards during swing significantly)
                if (stickBendB < -10) { stickBendB = -10; bendVelB = 0; }
                if (stickBendC < -10) { stickBendC = -10; bendVelC = 0; }

                // Calculate exact blade tip X position incorporating bends
                const totalBend = stickBendB + stickBendC;
                const tipAngleRad = deg2rad(angularPos + totalBend);
                const bladeX = CENTER_X + ROD_LENGTH * Math.cos(tipAngleRad);

                // Puck collision / pushing logic
                if (bladeX > puckX && angularPos <= 130) {
                    // Stick is pushing the puck. We also calculate the explosive velocity from the whip.
                    // Instead of just taking the bladeX difference, we add the velocity from the whip/recoil phase.
                    // This allows the puck to realistically fly off the blade slightly faster than the base swing speed
                    // when the stick snaps back into shape.
                    let instantaneousPuckVel = (bladeX - puckX) / true_dt;

                    // In a snap shot, the final puck velocity is a combination of swing velocity + whip velocity.
                    puckVelX = instantaneousPuckVel;
                    puckX = bladeX;
                } else {
                    // Coasting free - add a slight exponential decay if it hits the air, but mostly retains speed
                    puckX += puckVelX * true_dt;
                }

                precalculatedPhysicsData.push({
                    t: t,
                    angularPos: angularPos,
                    angularVel: angularVel,
                    stickBendB: stickBendB,
                    bendVelB: bendVelB,
                    axisB_pos: axisB_pos,
                    stickBendC: stickBendC,
                    bendVelC: bendVelC,
                    axisC_pos: axisC_pos,
                    hasAxisC: kpList.length > 1,
                    puckX: puckX,
                    puckY: puckY
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let t = getT();
            let speed = parseFloat(speedSlider.value);
            const previousSwingT = lastSwingT;
            const movingBackward = previousSwingT !== null && t < previousSwingT;
            const movingForward = previousSwingT !== null && t > previousSwingT;

            // Reversing the swing repairs the break. Keeping the same value does nothing.
            if (movingBackward) {
                brokenState = null;
                breakTriggerT = null;
            }
            lastSwingT = t;

            valRot.innerText = Math.round(getSwingAngle(t)) + "°";
            valSpeed.innerText = useMph ? Math.round(speed * 0.621371) + " mph" : speed + " km/h";
            speedCat.innerText = getSpeedCategory(speed);

            // Activeer de Pan/Zoom camera
            ctx.save();
            ctx.translate(panX, panY);
            ctx.scale(zoom, zoom);

            drawStick(t, previousSwingT, movingForward, speed);

            // Camera uit
            ctx.restore();
        }

        function getWeights() {
            const weights = [];
            let weightSum = 0;
            const sigma1 = 0.12;

            for (let i = 0; i < SEGMENTS; i++) {
                const pos = i / (SEGMENTS - 1);
                let weight = Math.exp(-Math.pow(pos - kp1, 2) / (2 * sigma1 * sigma1));

                if (cbKp2.checked) {
                    const sigma2 = Math.max(0.02, kp2.w / 1.5);
                    weight += Math.exp(-Math.pow(pos - kp2.c, 2) / (2 * sigma2 * sigma2));
                }
                if (cbKp3.checked) {
                    const sigma3 = Math.max(0.02, kp3.w / 1.5);
                    weight += Math.exp(-Math.pow(pos - kp3.c, 2) / (2 * sigma3 * sigma3));
                }

                weights.push(weight);
                weightSum += weight;
            }
            return { weights, weightSum };
        }

        function findBreakIndex(totalBend, weights, weightSum, rotation = 150) {
            // Floor contact may bend the rod slightly, but snapping is only
            // allowed after the puck-impact phase has started.
            if (cbNeverBreak.checked || rotation < 150) return -1;
            const breakLimit = getBreakLimit(flex);
            for (let i = 0; i < SEGMENTS; i++) {
                // Match the same local-angle calculation used while drawing.
                // The previous * 0.01 made forward-motion detection use a
                // different scale from the visible rod and break too early.
                const localCurvature = Math.abs(
                    (weights[i] / weightSum) * totalBend * SEGMENTS * getAdvancedNumber('angleScale')
                );
                if (localCurvature > breakLimit && i > SEGMENTS * 0.1) return i;
            }
            return -1;
        }

        function findBreakDuringForwardMotion(fromT, toT, speed, weights, weightSum) {
            // A single slider input event may cover a large part of the swing.
            // Test every physics sample in that interval so the break cannot be skipped.
            if (fromT === null || toT <= fromT) return null;

            const firstStep = Math.max(0, Math.floor(fromT * 1000));
            const lastStep = Math.min(1000, Math.ceil(toT * 1000));
            for (let step = firstStep; step <= lastStep; step++) {
                const candidateT = step / 1000;

                const physState = precalculatedPhysicsData[step];
                const bend = physState ? (physState.stickBendB + physState.stickBendC) : (precalculatedTips[step] ?? getRawBend(candidateT, speed, flex));

                const candidateRotation = getSwingAngle(candidateT);
                const breakIndex = findBreakIndex(bend, weights, weightSum, candidateRotation);
                if (breakIndex >= 0) return { t: candidateT, breakIndex };
            }
            return null;
        }

        function drawStick(t, previousSwingT = null, movingForward = false, speed = parseFloat(speedSlider.value)) {
            let lookupIndex = Math.min(1000, Math.max(0, Math.round(t * 1000)));
            const physState = precalculatedPhysicsData[lookupIndex] || {
                angularPos: 240 - (t * 240),
                stickBendB: 0, stickBendC: 0
            };

            const baseAngleDeg = physState.angularPos;
            const totalBend = physState.stickBendB + physState.stickBendC;
            const showHelpers = cbShowHelpers.checked;

            // The puck is struck at the lower tip after the 150° impact phase.
            // Its displacement is driven by the transferred impact energy.
            drawPuck(t, speed);

            if (showHelpers) {
                drawVelocityVectors(t);

                // Ghost Line
                ctx.beginPath();
                ctx.moveTo(CENTER_X, CENTER_Y);
                const tipX = CENTER_X + ROD_LENGTH * Math.cos(deg2rad(baseAngleDeg));
                const tipY = CENTER_Y + ROD_LENGTH * Math.sin(deg2rad(baseAngleDeg));
                ctx.lineTo(tipX, tipY);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 6]);
                ctx.stroke();
                ctx.setLineDash([]);

                // Teken visuele zones
                if (cbKp2.checked) drawZoneVisual(kp2, baseAngleDeg, 'rgba(255,0,212,');
                if (cbKp3.checked) drawZoneVisual(kp3, baseAngleDeg, 'rgba(255,255,0,');
            }

            // Bepaal de gewichten
            let weights = [];
            let weightSum = 0;
            const sigma1 = 0.12;

            for (let i = 0; i < SEGMENTS; i++) {
                let pos = i / (SEGMENTS - 1);
                let w = Math.exp(-Math.pow(pos - kp1, 2) / (2 * sigma1 * sigma1));

                if (cbKp2.checked) {
                    let s2 = Math.max(0.02, kp2.w / 1.5);
                    w += Math.exp(-Math.pow(pos - kp2.c, 2) / (2 * s2 * s2));
                }
                if (cbKp3.checked) {
                    let s3 = Math.max(0.02, kp3.w / 1.5);
                    w += Math.exp(-Math.pow(pos - kp3.c, 2) / (2 * s3 * s3));
                }
                weights.push(w);
                weightSum += w;
            }

            let currentAngle = baseAngleDeg;
            let curX = CENTER_X;
            let curY = CENTER_Y;
            let segLen = ROD_LENGTH / SEGMENTS;
            let breakOccurred = false;

            // Detect every crossed physics step, so fast slider movement cannot skip a break.
            const motionBreak = movingForward && !brokenState
                ? findBreakDuringForwardMotion(previousSwingT, t, speed, weights, weightSum)
                : null;
            if (motionBreak && !brokenState) {
                const breakAngle = 240 - (motionBreak.t * 240);
                let breakX = CENTER_X;
                let breakY = CENTER_Y;
                let angle = breakAngle;

                const breakPhysState = precalculatedPhysicsData[Math.round(motionBreak.t * 1000)];
                const breakTotalBend = breakPhysState ? (breakPhysState.stickBendB + breakPhysState.stickBendC) : 0;

                for (let i = 0; i < motionBreak.breakIndex; i++) {
                    angle += (weights[i] / weightSum) * breakTotalBend;
                    breakX += segLen * Math.cos(deg2rad(angle));
                    breakY += segLen * Math.sin(deg2rad(angle));
                }
                brokenState = {
                    x: breakX,
                    y: breakY,
                    angleOffset: angle - breakAngle + 40,
                    length: ROD_LENGTH - (motionBreak.breakIndex * segLen),
                    breakIndex: motionBreak.breakIndex
                };
                breakTriggerT = motionBreak.t;
            }

            for (let i = 0; i < SEGMENTS; i++) {
                if (brokenState && i >= brokenState.breakIndex) break;

                let wNorm = weights[i] / weightSum;
                let localBend = (wNorm * totalBend);
                currentAngle += localBend;

                // Convert the distributed bend into the same local-angle scale
                // used by the break detector and the break-angle sliders.
                let localCurvature = Math.abs(localBend * SEGMENTS * getAdvancedNumber('angleScale'));

                let nextX = curX + segLen * Math.cos(deg2rad(currentAngle));
                let nextY = curY + segLen * Math.sin(deg2rad(currentAngle));

                if (!cbNeverBreak.checked && getSwingAngle(t) >= 150 &&
                    localCurvature > getBreakLimit(flex) && i > SEGMENTS * 0.1) {
                    if (!brokenState) {
                        brokenState = {
                            x: curX,
                            y: curY,
                            // Preserve the snap angle while matching the clamped part's rotation.
                            angleOffset: currentAngle - baseAngleDeg + 40,
                            length: ROD_LENGTH - (i * segLen),
                            breakIndex: i
                        };
                        breakTriggerT = t;
                    }
                    breakOccurred = true;
                    break;
                }

                // Kleur afhankelijk van lokaal buig-gevaar
                let baseIntensity = Math.min(1, Math.abs(totalBend) / 50) * 0.4;
                let peakIntensity = Math.min(1, localCurvature / getBreakLimit(flex));
                let finalIntensity = Math.max(baseIntensity, peakIntensity);
                let hue = 120 - (finalIntensity * 120);

                ctx.beginPath();
                ctx.moveTo(curX, curY);
                ctx.lineTo(nextX, nextY);
                ctx.strokeStyle = `hsl(${hue}, 100%, 50%)`;
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                ctx.stroke();

                curX = nextX;
                curY = nextY;
            }

            // Fall is driven by forward swing progress, not rendering-frame speed.
            if (brokenState) {
                const fall = Math.min(
                    FALL_DISTANCE_PER_SWING,
                    Math.max(0, (t - breakTriggerT) * FALL_DISTANCE_PER_SWING / (1 - breakTriggerT))
                );
                // The break point remains attached to the rotating clamped section.
                // `curX` and `curY` are the current end of that upper section.
                const fallX = curX;
                const fallY = curY + fall;
                // The detached piece keeps rotating at the same global speed.
                const detachedAngle = baseAngleDeg + brokenState.angleOffset;
                const endX = fallX + brokenState.length * Math.cos(deg2rad(detachedAngle));
                const endY = fallY + brokenState.length * Math.sin(deg2rad(detachedAngle));

                ctx.beginPath();
                ctx.moveTo(fallX, fallY);
                ctx.lineTo(endX, endY);
                ctx.strokeStyle = '#ff0000';
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                ctx.stroke();

                ctx.fillStyle = "#ff0000";
                ctx.font = `bold ${Math.max(12, 22 / zoom)}px Arial`;
            }

            // Scharnier
            ctx.beginPath();
            ctx.arc(CENTER_X, CENTER_Y, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();

            // Teken interactieve nodes alleen als hulplijnen aanstaan
            if (showHelpers) {
                drawKpNode(kp1, baseAngleDeg, '#00d2ff', dragging === 'kp1', 'circle');

                if (cbKp2.checked) {
                    drawKpNode(kp2.c, baseAngleDeg, '#ff00d2', dragging === 'kp2_c', 'circle');
                    drawKpNode(kp2.c - kp2.w, baseAngleDeg, '#ff00d2', dragging === 'kp2_t', 'square');
                    drawKpNode(kp2.c + kp2.w, baseAngleDeg, '#ff00d2', dragging === 'kp2_b', 'square');
                }
                if (cbKp3.checked) {
                    drawKpNode(kp3.c, baseAngleDeg, '#ffff00', dragging === 'kp3_c', 'circle');
                    drawKpNode(kp3.c - kp3.w, baseAngleDeg, '#ffff00', dragging === 'kp3_t', 'square');
                    drawKpNode(kp3.c + kp3.w, baseAngleDeg, '#ffff00', dragging === 'kp3_b', 'square');
                }
            }
        }

        function drawPuck(t, speed) {
            let lookupIndex = Math.min(1000, Math.max(0, Math.round(t * 1000)));
            const physState = precalculatedPhysicsData[lookupIndex];
            if (!physState) return;

            // Don't draw the puck until the swing is approaching it
            if (physState.angularPos > 135) return;

            const puckX = physState.puckX;
            const puckY = physState.puckY;
            const radius = 12;

            ctx.beginPath();
            ctx.arc(puckX, puckY, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#d7d7d7';
            ctx.fill();
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#222';
            ctx.font = `${Math.max(10, 12 / zoom)}px Arial`;
            ctx.fillText('Puck', puckX - 15, puckY + 28);
        }

        function drawVelocityVectors(t) {
            let lookupIndex = Math.min(1000, Math.max(0, Math.round(t * 1000)));
            const physState = precalculatedPhysicsData[lookupIndex];
            if (!physState) return;

            // Only show vectors when there's actually speed or bending happening
            if (Math.abs(physState.angularVel) < 0.1 && Math.abs(physState.bendVelB) < 0.1 && Math.abs(physState.bendVelC) < 0.1) return;

            const angleRad = deg2rad(physState.angularPos);

            // Blade Tip Position (simplified as end of rod without bend for vector origin)
            const tipX = CENTER_X + ROD_LENGTH * Math.cos(angleRad);
            const tipY = CENTER_Y + ROD_LENGTH * Math.sin(angleRad);

            // Function to draw arrows
            function drawArrow(x, y, vx, vy, color, label, offsetLabelX=0, offsetLabelY=0) {
                const len = Math.hypot(vx, vy);
                if (len < 5) return; // Don't draw tiny arrows

                // Scale velocity to pixel length for visualization
                const scale = 0.5;
                const dx = vx * scale;
                const dy = vy * scale;
                const forceSize = 3;

                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + dx, y + dy);
                ctx.strokeStyle = color;
                ctx.lineWidth = forceSize;
                ctx.stroke();

                // Arrowhead
                const nx = dx / len;
                const ny = dy / len;
                ctx.beginPath();
                ctx.moveTo(x + dx, y + dy);
                ctx.lineTo(x + dx - nx * 9 - ny * 5, y + dy - ny * 9 + nx * 5);
                ctx.lineTo(x + dx - nx * 9 + ny * 5, y + dy - ny * 9 - nx * 5);
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();

                ctx.fillStyle = color;
                ctx.font = `bold ${Math.max(10, 14 / zoom)}px Arial`;
                ctx.fillText(label, x + dx + offsetLabelX, y + dy + offsetLabelY);
            }

            // 1. Shaft Swing Velocity (v_a = r_a * w_a)
            // Velocity is perpendicular to the shaft
            const ra = ROD_LENGTH;
            // angularVel is deg/s, convert to rad/s roughly for visualization magnitude
            const va_mag = physState.angularVel * 0.5;
            const va_dirX = -Math.sin(angleRad); // Perpendicular to radius
            const va_dirY = Math.cos(angleRad);
            drawArrow(tipX, tipY, va_dirX * va_mag, va_dirY * va_mag, '#00e5ff', 'Va (Swing)', 5, 5);

            let currentTipX = tipX + (va_dirX * va_mag * 0.5);
            let currentTipY = tipY + (va_dirY * va_mag * 0.5);

            // 2. Whip Velocity from Axis B (v_b = r_b * w_b)
            const rb = ROD_LENGTH * (1.0 - physState.axisB_pos);
            const vb_mag = physState.bendVelB * 2.0; // Scale up for visibility
            drawArrow(currentTipX, currentTipY, va_dirX * vb_mag, va_dirY * vb_mag, '#ff00d2', 'Vb (Kick 1)', 5, 15);

            currentTipX += (va_dirX * vb_mag * 0.5);
            currentTipY += (va_dirY * vb_mag * 0.5);

            // 3. Whip Velocity from Axis C (v_c = r_c * w_c)
            if (physState.hasAxisC) {
                const rc = ROD_LENGTH * (1.0 - physState.axisC_pos);
                const vc_mag = physState.bendVelC * 2.0;
                drawArrow(currentTipX, currentTipY, va_dirX * vc_mag, va_dirY * vc_mag, '#ffff00', 'Vc (Kick 2)', 5, 25);
            }

            // Draw Axis Labels at their locations
            function drawAxisLabel(pos, label, color) {
                const lx = CENTER_X + (pos * ROD_LENGTH) * Math.cos(angleRad);
                const ly = CENTER_Y + (pos * ROD_LENGTH) * Math.sin(angleRad);
                ctx.fillStyle = color;
                ctx.font = `bold ${Math.max(12, 16 / zoom)}px Arial`;
                ctx.fillText(label, lx - 40, ly - 10);
            }

            drawAxisLabel(0, 'Axis a', '#00e5ff');
            drawAxisLabel(physState.axisB_pos, 'Axis b', '#ff00d2');
            if (physState.hasAxisC) drawAxisLabel(physState.axisC_pos, 'Axis c', '#ffff00');
        }

        function drawOpposingForces(angleDeg, t) {
            // Deprecated - replaced by drawVelocityVectors to match blueprint
        }

        function drawZoneVisual(zone, angleDeg, colorPrefix) {
            let startPos = zone.c - zone.w;
            let endPos = zone.c + zone.w;

            let sx = CENTER_X + (startPos * ROD_LENGTH) * Math.cos(deg2rad(angleDeg));
            let sy = CENTER_Y + (startPos * ROD_LENGTH) * Math.sin(deg2rad(angleDeg));
            let ex = CENTER_X + (endPos * ROD_LENGTH) * Math.cos(deg2rad(angleDeg));
            let ey = CENTER_Y + (endPos * ROD_LENGTH) * Math.sin(deg2rad(angleDeg));

            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(ex, ey);
            ctx.strokeStyle = colorPrefix + '0.35)';
            ctx.lineWidth = 20;
            ctx.lineCap = 'butt';
            ctx.stroke();
        }

        function drawKpNode(val, angleDeg, color, isDragging, shape) {
            let px = CENTER_X + (val * ROD_LENGTH) * Math.cos(deg2rad(angleDeg));
            let py = CENTER_Y + (val * ROD_LENGTH) * Math.sin(deg2rad(angleDeg));

            ctx.beginPath();
            ctx.fillStyle = color;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2 / zoom; // Hou de randen mooi dun bij ver inzoomen

            let size = isDragging ? 9 : 7;
            // Zorg dat de elementen schaalbaar maar klikbaar blijven
            size = size / (zoom > 1 ? Math.sqrt(zoom) : zoom);

            if (shape === 'circle') {
                ctx.arc(px, py, size * 1.5, 0, Math.PI * 2);
            } else {
                ctx.rect(px - size, py - size, size*2, size*2);
            }

            ctx.fill();
            ctx.stroke();
        }

        // --- Interactie Logica (aangepast voor Camera Pan/Zoom) ---
        function getRawPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function getWorldPos(raw) {
            return {
                x: (raw.x - panX) / zoom,
                y: (raw.y - panY) / zoom
            };
        }

        function checkHit(worldPos, val, baseAngleDeg) {
            if (!cbShowHelpers.checked) return false; // Kan niet klikken als ze onzichtbaar zijn

            let px = CENTER_X + (val * ROD_LENGTH) * Math.cos(deg2rad(baseAngleDeg));
            let py = CENTER_Y + (val * ROD_LENGTH) * Math.sin(deg2rad(baseAngleDeg));
            // Touch radius is 25 in "schermpixels", dus we delen door zoom voor de world hit area
            return Math.hypot(worldPos.x - px, worldPos.y - py) < (25 / zoom);
        }

        function handlePointerDown(e) {
            const raw = getRawPos(e);
            const world = getWorldPos(raw);

            let t = getT();
            let baseAngleDeg = 240 - (t * 240);

            dragging = null;
            if (checkHit(world, kp1, baseAngleDeg)) dragging = 'kp1';

            if (!dragging && cbKp3.checked) {
                if (checkHit(world, kp3.c, baseAngleDeg)) dragging = 'kp3_c';
                else if (checkHit(world, kp3.c - kp3.w, baseAngleDeg)) dragging = 'kp3_t';
                else if (checkHit(world, kp3.c + kp3.w, baseAngleDeg)) dragging = 'kp3_b';
            }
            if (!dragging && cbKp2.checked) {
                if (checkHit(world, kp2.c, baseAngleDeg)) dragging = 'kp2_c';
                else if (checkHit(world, kp2.c - kp2.w, baseAngleDeg)) dragging = 'kp2_t';
                else if (checkHit(world, kp2.c + kp2.w, baseAngleDeg)) dragging = 'kp2_b';
            }

            if (!dragging) {
                // We slepen op de achtergrond -> PAN modus
                dragging = 'pan';
                lastPanPos = raw;
            } else {
                e.preventDefault();
                tooltip.style.display = 'block';
            }
        }

        function handlePointerMove(e) {
            if (!dragging) return;
            e.preventDefault();

            const raw = getRawPos(e);

            // Panning van de camera
            if (dragging === 'pan') {
                panX += (raw.x - lastPanPos.x);
                panY += (raw.y - lastPanPos.y);
                lastPanPos = raw;
                draw();
                return;
            }

            // Verplaatsen van nodes
            const world = getWorldPos(raw);
            let t = getT();
            let baseAngleDeg = 240 - (t * 240);

            let vX = Math.cos(deg2rad(baseAngleDeg));
            let vY = Math.sin(deg2rad(baseAngleDeg));
            let dotProduct = ((world.x - CENTER_X) * vX + (world.y - CENTER_Y) * vY) / ROD_LENGTH;
            let newPos = Math.max(0.02, Math.min(0.98, dotProduct));

            // Horizontale muisbeweging over het pure beeldscherm -> Flex (Los van zoom!)
            let horizontalPercent = Math.max(0, Math.min(1, raw.x / canvas.width));
            flex = 125 - (horizontalPercent * 105);

            let ttName = "";

            if (dragging === 'kp1') {
                kp1 = newPos;
                ttName = getKpName(1, kp1);
            }
            else if (dragging.startsWith('kp2')) {
                if (dragging === 'kp2_c') {
                    kp2.c = Math.max(kp2.w + 0.02, Math.min(0.98 - kp2.w, newPos));
                } else {
                    let w = Math.abs(newPos - kp2.c);
                    kp2.w = Math.max(0.03, Math.min(w, kp2.c - 0.02, 0.98 - kp2.c));
                }
                ttName = getKpName(2, kp2.c);
            }
            else if (dragging.startsWith('kp3')) {
                if (dragging === 'kp3_c') {
                    kp3.c = Math.max(kp3.w + 0.02, Math.min(0.98 - kp3.w, newPos));
                } else {
                    let w = Math.abs(newPos - kp3.c);
                    kp3.w = Math.max(0.03, Math.min(w, kp3.c - 0.02, 0.98 - kp3.c));
                }
                ttName = getKpName(3, kp3.c);
            }

            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            tooltip.style.left = (clientX + 15) + 'px';
            tooltip.style.top = (clientY - 30) + 'px';
            tooltip.innerHTML = `${ttName}<br>Flex: ${Math.round(flex)}`;

            precalculatePhysics();
            draw();
        }

        function handlePointerUp() {
            dragging = null;
            tooltip.style.display = 'none';
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        canvas.addEventListener('touchstart', handlePointerDown, {passive: false});
        canvas.addEventListener('touchmove', handlePointerMove, {passive: false});
        window.addEventListener('touchend', handlePointerUp);

        timeSlider.addEventListener('input', draw);
        speedSlider.addEventListener('input', () => { precalculatePhysics(); draw(); });
        cbKp2.addEventListener('change', () => { precalculatePhysics(); draw(); });
        cbKp3.addEventListener('change', () => { precalculatePhysics(); draw(); });
        cbShowHelpers.addEventListener('change', draw);
        cbNeverBreak.addEventListener('change', () => {
            if (cbNeverBreak.checked) {
                brokenState = null;
                breakTriggerT = null;
            }
            draw();
        });
        unitToggle.addEventListener('click', () => { useMph = !useMph; draw(); });

        advancedToggle.addEventListener('click', () => {
            advancedSettings.classList.toggle('open');
            advancedToggle.textContent = advancedSettings.classList.contains('open')
                ? '⚙ Hide advanced settings'
                : '⚙ Advanced settings';
        });

        Object.values(advancedControls).forEach(control => {
            control.addEventListener('input', () => {
                // Keep the two break limits logically ordered.
                if (advancedControls.breakHigh.value > advancedControls.breakLow.value) {
                    advancedControls.breakHigh.value = advancedControls.breakLow.value;
                }
                updateAdvancedValueLabels();
                precalculatePhysics();
                draw();
            });
        });

        updateAdvancedValueLabels();
        resize();

        // Start initieel direct 1.3x ingezoomd, dat vult het scherm prachtig op
        resize();
        doZoom(1.3);

    </script>
</body>
</html>
